  # ── OPPORTUNITIES ─────────────────────────────────────────────

  - name: fact_participants
    layer: beta
    sub_layer: trusted
    engine: spark
    write_mode: overwrite
    metadata: {domain: opportunities}
    spark_config: {additional_configs: {spark.sql.ansi.enabled: "false"}}
    data_quality: {on_failure: fail, checks: [{type: row_count_min, value: 1}]}
    transform:
      sql_file: sql/opportunities/fact_opty_participants.sql
      iceberg_properties: {format-version: "3"}
      sources:
        - {table: polaris.alpha.crm_nas.crm_plus_opty_participants_info, alias: participants}
        - {table: polaris.alpha.crm_nas.crm_plus_opty_accesslist_info, alias: accesslist}

